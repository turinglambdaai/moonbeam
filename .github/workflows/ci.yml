name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install websocket library
        run: raco pkg install --auto --no-docs https://github.com/turinglambdaai/websocket.git
        shell: bash
      - name: Install package
        run: raco pkg install --auto --name moonbeam --link racket
        shell: bash
      - name: Run tests
        run: raco test racket/moonbeam
        shell: bash
